[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiosmartctl"
dynamic = ["version"]
description = "Asynchronous client for reading SMART disk data with smartctl over SSH"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christian Handy" }]
requires-python = ">=3.13"
dependencies = ["asyncssh>=2.17.0"]
keywords = ["smart", "smartctl", "smartmontools", "ssh", "disk", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ChristianHandy/HAOS_SMART_Monitor/tree/main/library"
Issues = "https://github.com/ChristianHandy/HAOS_SMART_Monitor/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[tool.hatch.version]
path = "src/aiosmartctl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aiosmartctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["aiosmartctl"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]
